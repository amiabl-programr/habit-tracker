<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>

<!-- Open Graph / social preview (use absolute https URLs when deploying) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Habit Tracker">
<meta property="og:description" content="Track 7 days of habits and print your tracker as a PDF.">
<meta property="og:image" content="assets/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Habit Tracker table with completed habits marked in green">

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Habit Tracker">
<meta name="twitter:description" content="Track 7 days of habits and print your tracker as a PDF.">
<meta name="twitter:image" content="assets/og-image.png">

<link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div id="title-display" class="editing" contenteditable="true" onfocus="this.dataset.old=''" ontoggle="toggleTitleMode()">
  <span id="title-view-text">Habit Tracker</span>
  <span id="title-edit" onblur="toggleTitleMode()"></span>
</div>

<div class="controls">
  <button class="btn btn-primary" id="print-btn">Print / Save as PDF</button>
  <button class="btn reset-btn" id="reset-btn">Reset to default</button>
  <button class="btn btn-success" id="add-row-btn">Add row</button>
</div>

<table id="habit-table">
  <thead>
    <tr>
      <th class="habit-col">Habits</th>
      <th class="day-cell" data-day="Day One">Day One</th>
      <th class="day-cell" data-day="Day Two">Day Two</th>
      <th class="day-cell" data-day="Day Three">Day Three</th>
      <th class="day-cell" data-day="Day Four">Day Four</th>
      <th class="day-cell" data-day="Day Five">Day Five</th>
      <th class="day-cell" data-day="Day Six">Day Six</th>
      <th class="day-cell" data-day="Day Seven">Day Seven</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="scripts/script.js"></script>

</body>
</html>
