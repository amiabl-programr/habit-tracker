<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #212529;
    --muted: #6c757d;
    --green: #28a745;
    --red: #dc3545;
    --border: #dee2e6;
    --table-header: #e9ecef;
  }

  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
  }

  h1 { margin: 0 0 10px; font-size: 1.4rem; }

  /* Title editable */
  #title-display {
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    min-height: 28px;
    overflow: hidden;
  }
  #title-view-text { display: inline; font-weight: bold; }
  #title-edit { border: none; font-family: inherit; font-size: inherit; background: transparent; width: 100%; padding: 0; outline: none; font-weight: bold; color: var(--text); line-height: 1.4; display: none; }
  #title-view.editing #title-view-text { display: none; }
  #title-view.editing #title-edit { display: inline; }

  /* Controls */
  .controls { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn, .toggle-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
  .btn:hover, .toggle-btn:hover { border-color: #a0a0a0; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { border-color: #007bff; color: #007bff; }
  .toggle-btn { gap: 4px; padding: 4px 8px; font-size: 0.8rem; }
  .toggle-btn.active { background: var(--green); color: white; border-color: var(--green); }
  .toggle-btn.inactive { background: var(--red); color: white; border-color: var(--red); }
  .reset-btn { border-color: #6c757d; color: #6c757d; }

  /* Table */
  #habit-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
  #habit-table thead { position: sticky; top: 0; background: var(--table-header); z-index: 10; }
  #habit-table th, #habit-table td { border: 1px solid var(--border); padding: 6px 4px; text-align: center; vertical-align: middle; }
  #habit-table th { background: var(--table-header); font-weight: 600; font-size: 0.7rem; user-select: none; }
  #habit-table .habit-cell { text-align: left; font-weight: 500; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #habit-table .day-cell { width: 40px; }
  #habit-table .habit-col { width: 220px; min-width: 220px; }

  /* Cell selected state */
  .cell-selected { background: #d4edda !important; color: var(--green) !important; }
  .cell-selected::after { content: "✔️"; font-size: 1rem; line-height: 1; }
  .cell-unred { color: var(--red) !important; background: #f8d7da !important; }
  .cell-unred::after { content: "❌"; font-size: 1rem; line-height: 1; }
  .cell-selected, .cell-unred { user-select: none; }

  /* Print CSS */
  @media print {
    .controls, .toggle-panel, #reset-btn { display: none !important; }
    body { margin: 0; padding: 0; }
    #habit-table { margin: 0; font-size: 7pt; }
    #habit-table thead { background: #fff; }
    #habit-table th { border-color: #000; background: #fff; }
    #habit-table td { border-color: #000; }
    #title-display { border: 1px solid #000; padding: 6px; margin-bottom: 8px; }
  }

  /* Focus */
  *:focus-visible { outline: 2px solid #007bff; outline-offset: 2px; }
</style>
</head>
<body>

<div id="title-display" class="editing" contenteditable="true" onfocus="this.dataset.old=''" ontoggle="toggleTitleMode()">
  <span id="title-view-text">Habit Tracker</span>
  <span id="title-edit" onblur="toggleTitleMode()"></span>
</div>

<div class="controls">
  <button class="btn btn-primary" id="print-btn">Print / Save as PDF</button>
  <button class="btn reset-btn" id="reset-btn">Reset to default</button>
  <button class="btn btn-success" id="add-row-btn">Add row</button>
  <span class="toggle-btn active" id="ublank-toggle" aria-pressed="true">Unselected cells: Blank</span>
  <span class="toggle-btn inactive" id="ured-toggle" aria-pressed="false">Unselected cells: Red</span>
</div>

<table id="habit-table">
  <thead>
    <tr>
      <th class="habit-col">Habits</th>
      <th class="day-cell" data-day="Day One">Day One</th>
      <th class="day-cell" data-day="Day Two">Day Two</th>
      <th class="day-cell" data-day="Day Three">Day Three</th>
      <th class="day-cell" data-day="Day Four">Day Four</th>
      <th class="day-cell" data-day="Day Five">Day Five</th>
      <th class="day-cell" data-day="Day Six">Day Six</th>
      <th class="day-cell" data-day="Day Seven">Day Seven</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  // ---- State ----
  const DEFAULT_HABITS = [
    'Read 10+ pages',
    'Pray one hour daily',
    'Give 2+ hour to learning a skill',
    'Wake up by 5:00 am',
    'Drink 3 litters of water',
    'Eat clean - no junks',
    'Take hard decisions',
    'Daily Journaling',
    'No phone first hour',
    'Bible Reading',
    'No soda or sugar',
    'Walk - brisk',
    'Reach out to 1+ person daily to check up',
    'Sit still for 15 minutes'
  ];

  let state = {
    habits: [],
    unselectedMode: 'blank',
    title: 'Habit Tracker'
  };

  const DAYS = ['Day One','Day Two','Day Three','Day Four','Day Five','Day Six','Day Seven'];

  // DOM elements
  const tbody = document.querySelector('#habit-table tbody');
  const printBtn = document.getElementById('print-btn');
  const resetBtn = document.getElementById('reset-btn');
  const addRowBtn = document.getElementById('add-row-btn');
  const ublankToggle = document.getElementById('ublank-toggle');
  const uredToggle = document.getElementById('ured-toggle');
  const titleDisplay = document.getElementById('title-display');

  // ---- Init / localStorage ----
  function loadState() {
    const saved = localStorage.getItem('habitTrackerState');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        state = { ...state, ...parsed };
        if (state.habits === undefined || state.habits.length === 0) state.habits = initDefaultHabits();
        if (state.unselectedMode === undefined) state.unselectedMode = 'blank';
        if (state.title === undefined) state.title = 'Habit Tracker';
      } catch { state = initDefault(); }
    } else {
      state = initDefault();
    }
    applyTitle();
    updateToggleUI();
    renderTable();
    addSelectionHighlight();
  }

  function initDefault() {
    const habits = DEFAULT_HABITS.map(name => ({
      name,
      selected: [false, false, false, false, false, false, false]
    }));
    return { habits, unselectedMode: 'blank', title: 'Habit Tracker' };
  }

  function initDefaultHabits() {
    return DEFAULT_HABITS.map(name => ({
      name,
      selected: [false, false, false, false, false, false, false]
    }));
  }

  function saveState() {
    localStorage.setItem('habitTrackerState', JSON.stringify(state));
  }

  // ---- Title handling ----
  function toggleTitleMode() {
    titleDisplay.classList.toggle('editing');
  }
  function applyTitle() {
    document.getElementById('title-view-text').textContent = state.title;
  }

  // ---- Render table ----
  function renderTable() {
    // build header
    let theadHTML = '<tr><th class="habit-col">Habits</th>';
    DAYS.forEach(d => theadHTML += `<th class="day-cell" data-day="${d}">${d}</th>`);
    theadHTML += '</tr>';
    document.querySelector('#habit-table thead').innerHTML = theadHTML;

    // build rows
    let tbodyHTML = '';
    state.habits.forEach((h, ridx) => {
      tbodyHTML += `<tr>
        <td class="habit-cell habit-col" contenteditable="true" onblur="saveHabitName(this, ${ridx})" onkeypress="if(event.key==='Enter'){event.preventDefault();saveHabitName(this,${ridx})}">${h.name} <button class="btn btn-danger btn-sm" onclick="deleteRow(${ridx})">×</button></td>`;
      h.selected.forEach((s, cid) => {
        const cls = s ? 'cell-selected' : (state.unselectedMode === 'red' ? 'cell-unred' : '');
        const mark = s ? '✔️' : (state.unselectedMode === 'red' ? '❌' : '');
        tbodyHTML += `<td class="day-cell ${cls}" data-row="${ridx}" data-col="${cid}" tabindex="0" role="button" aria-pressed="${s}" onclick="toggleCell(this, ${ridx}, ${cid})">${mark}</td>`;
      });
      tbodyHTML += `</tr>`;
    });
    tbody.innerHTML = tbodyHTML;
    addSelectionHighlight();
    saveState();
  }

  // ---- Cell toggle ----
  function toggleCell(el, ridx, cid) {
    if (!el.classList.contains('day-cell')) return;
    state.habits[ridx].selected[cid] = !state.habits[ridx].selected[cid];
    renderTable();
    addSelectionHighlight();
  }

  // ---- Drag selection ----
  let dragStart = null;
  document.querySelectorAll('#habit-table .day-cell').forEach(el => {
    el.addEventListener('mousedown', e => {
      if (e.target.classList.contains('day-cell')) {
        dragStart = { row: parseInt(e.target.dataset.row), col: parseInt(e.target.dataset.col) };
        e.target.focus();
      }
    });
  });

  document.addEventListener('mouseup', e => {
    if (dragStart) {
      const target = e.target.closest('.day-cell');
      const endRow = parseInt(target?.dataset.row ?? dragStart.row);
      const endCol = parseInt(target?.dataset.col ?? dragStart.col);
      dragSelection(dragStart.row, dragStart.col, endRow, endCol);
      dragStart = null;
    }
  });

  function dragSelection(r1, c1, r2, c2) {
    const minRow = Math.min(r1, r2), maxRow = Math.max(r1, r2);
    const minCol = Math.min(c1, c2), maxCol = Math.max(c1, c2);
    for (let r = minRow; r <= maxRow; r++) {
      if (!state.habits[r]) continue;
      for (let c = minCol; c <= maxCol; c++) {
        if (state.habits[r] && state.habits[r].selected.length > c) {
          state.habits[r].selected[c] = true;
        }
      }
    }
    renderTable();
    addSelectionHighlight();
  }

  // ---- Select all / Clear all ----
  function selectAll() {
    state.habits.forEach(h => h.selected = [true, true, true, true, true, true, true]);
    renderTable();
    addSelectionHighlight();
  }
  function clearAll() {
    state.habits.forEach(h => h.selected = [false, false, false, false, false, false, false]);
    renderTable();
    addSelectionHighlight();
  }

  // ---- Unselected mode toggle ----
  function setUnselectedMode(mode) {
    state.unselectedMode = mode;
    renderTable();
    updateToggleUI();
    saveState();
  }

  function updateToggleUI() {
    if (state.unselectedMode === 'red') {
      uredToggle.classList.add('active');
      uredToggle.classList.remove('inactive');
      uredToggle.setAttribute('aria-pressed', 'true');
      ublankToggle.classList.remove('active');
      ublankToggle.classList.add('inactive');
      ublankToggle.setAttribute('aria-pressed', 'false');
    } else {
      ublankToggle.classList.add('active');
      ublankToggle.classList.remove('inactive');
      ublankToggle.setAttribute('aria-pressed', 'true');
      uredToggle.classList.remove('active');
      uredToggle.classList.add('inactive');
      uredToggle.setAttribute('aria-pressed', 'false');
    }
  }

  // ---- Add row ----
  function addRow() {
    state.habits.push({
      name: 'New habit',
      selected: [false, false, false, false, false, false, false]
    });
    renderTable();
    addSelectionHighlight();
    saveState();
  }

  // ---- Delete row with undo ----
  let lastDeleted = null;
  function deleteRow(ridx) {
    lastDeleted = { ...state.habits[ridx], ridx };
    state.habits.splice(ridx, 1);
    renderTable();
    addSelectionHighlight();
    saveState();
    showUndo();
  }
  function showUndo() {
    if (!lastDeleted) return;
    const btn = document.createElement('button');
    btn.textContent = 'Undo';
    btn.style.cssText = 'position:fixed; top:20px; left:20px; padding:6px 12px; background:#fff; border:1px solid #dee2e6; z-index:9999;';
    btn.onclick = () => {
      state.habits.splice(lastDeleted.ridx, 0, lastDeleted);
      renderTable();
      addSelectionHighlight();
      saveState();
      document.body.removeChild(btn);
      lastDeleted = null;
    };
    document.body.appendChild(btn);
    setTimeout(() => { document.body.removeChild(btn); lastDeleted = null; }, 5000);
  }

  // ---- Save habit name inline ----
  function saveHabitName(el, ridx) {
    const name = el.textContent.trim();
    if (name && name !== state.habits[ridx].name) {
      state.habits[ridx].name = name;
      renderTable();
      saveState();
    }
  }

  // ---- Print ----
  printBtn.addEventListener('click', () => {
    window.print();
  });

  // ---- Reset to default ----
  resetBtn.addEventListener('click', () => {
    if (confirm('Reset to default habits?')) {
      state = initDefault();
      renderTable();
      addSelectionHighlight();
      saveState();
    }
  });

  // ---- Add row ----
  addRowBtn.addEventListener('click', () => {
    addRow();
  });

  // ---- Init ----
  loadState();
</script>

</body>
</html>
